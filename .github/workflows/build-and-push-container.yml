name: Build and Push Container Images

on:
  workflow_call:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: string
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: string
      acr_name:
        description: 'Azure Container Registry Name'
        required: false
        type: string
      resource_group:
        description: 'Azure Resource Group Name'
        required: false
        type: string
      container_app_name:
        description: 'Container App Name (API)'
        required: false
        type: string
      migration_job_name:
        description: 'Migration Job Name'
        required: false
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: false
      SQL_ADMIN_PASSWORD:
        required: false

  workflow_dispatch:
    inputs:
      github-environment:
        description: 'GitHub Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      stack:
        description: 'Pulumi stack (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      acr_name:
        description: 'ACR Name (optional, will fetch if empty)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with Azure

env:
  IMAGE_NAME: hotshot-api
  MIGRATION_JOB_IMAGE_NAME: hotshot-db-migration-job

jobs:
  resolve-config:
    name: Resolve Configuration
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    outputs:
      acr_name: ${{ steps.config.outputs.acr_name }}
      resource_group: ${{ steps.config.outputs.resource_group }}
      container_app_name: ${{ steps.config.outputs.container_app_name }}
      migration_job_name: ${{ steps.config.outputs.migration_job_name }}
    steps:
      - name: Checkout code
        if: ${{ inputs.acr_name == '' }}
        uses: actions/checkout@v5

      - name: Resolve Configuration
        id: config
        env:
          INPUT_ACR: ${{ inputs.acr_name }}
          INPUT_RG: ${{ inputs.resource_group }}
          INPUT_CA: ${{ inputs.container_app_name }}
          INPUT_JOB: ${{ inputs.migration_job_name }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ inputs.stack }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD || 'placeholder-password-for-lookup' }}
        run: |
          # If key inputs are provided, use them (Workflow Call scenario)
          if [ -n "$INPUT_ACR" ] && [ -n "$INPUT_RG" ]; then
            echo "Using provided inputs"
            echo "acr_name=$INPUT_ACR" >> $GITHUB_OUTPUT
            echo "resource_group=$INPUT_RG" >> $GITHUB_OUTPUT
            echo "container_app_name=$INPUT_CA" >> $GITHUB_OUTPUT
            echo "migration_job_name=$INPUT_JOB" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Otherwise, fetch from Pulumi (Standalone scenario)
          echo "Fetching from Pulumi..."
          if [ -z "$PULUMI_ACCESS_TOKEN" ]; then
            echo "::error::PULUMI_ACCESS_TOKEN is required for standalone runs when inputs are missing"
            exit 1
          fi
          
          # Install Pulumi
          curl -fsSL https://get.pulumi.com | sh
          export PATH=$PATH:$HOME/.pulumi/bin
          
          cd 7-Deployment/Azure-deploy
          pulumi stack select $STACK --non-interactive 2>/dev/null || true
          
          # Get outputs
          ACR_NAME=$(pulumi stack output containerRegistryName 2>/dev/null || echo "")
          RESOURCE_GROUP=$(pulumi stack output resourceGroupName 2>/dev/null || echo "")
          CONTAINER_APP_NAME=$(pulumi stack output containerAppName 2>/dev/null || echo "")
          MIGRATION_JOB_NAME=$(pulumi stack output migrationJobName 2>/dev/null || echo "")
          
          if [ -z "$ACR_NAME" ]; then
            echo "::error::Could not determine ACR Name from Pulumi stack '$STACK'"
            exit 1
          fi

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "container_app_name=$CONTAINER_APP_NAME" >> $GITHUB_OUTPUT
          echo "migration_job_name=$MIGRATION_JOB_NAME" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: resolve-config
    environment: ${{ inputs.github-environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure Azure credentials (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (OIDC)
        run: |
          az acr login --name ${{ needs.resolve-config.outputs.acr_name }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve-config.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract metadata (tags, labels) for Migration Job
        id: meta-job
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve-config.outputs.acr_name }}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Migration Job Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./7-Deployment/HotshotLogistics.DbMigrationJob/Dockerfile
          push: true
          tags: ${{ steps.meta-job.outputs.tags }}
          labels: ${{ steps.meta-job.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update Container Apps with new images
        run: |
          RESOURCE_GROUP="${{ needs.resolve-config.outputs.resource_group }}"
          ACR_NAME="${{ needs.resolve-config.outputs.acr_name }}"
          
          # Update API Container App
          CONTAINER_APP_NAME="${{ needs.resolve-config.outputs.container_app_name }}"
          API_IMAGE="${ACR_NAME}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          
          if [ -n "$CONTAINER_APP_NAME" ]; then
            echo "Updating Container App: $CONTAINER_APP_NAME"
            echo "Image: $API_IMAGE"
            
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$API_IMAGE"
            
            echo "✅ Container App updated successfully"
          else
             echo "⚠️ Container App Name not found, skipping update"
          fi

          # Update Migration Job
          MIGRATION_JOB_NAME="${{ needs.resolve-config.outputs.migration_job_name }}"
          JOB_IMAGE="${ACR_NAME}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}:latest"

          if [ -n "$MIGRATION_JOB_NAME" ]; then
            echo "Updating Migration Job: $MIGRATION_JOB_NAME"
            echo "Image: $JOB_IMAGE"
            
            az containerapp job update \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$JOB_IMAGE"
            
            echo "✅ Migration Job updated successfully"
          else
             echo "⚠️ Migration Job Name not found, skipping update"
          fi

      - name: Summary
        run: |
          echo "### 🚀 Container Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Container Registry | ${{ needs.resolve-config.outputs.acr_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | ${{ needs.resolve-config.outputs.container_app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Job | ${{ needs.resolve-config.outputs.migration_job_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Image | ${{ needs.resolve-config.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Job Image | ${{ needs.resolve-config.outputs.acr_name }}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}:latest |" >> $GITHUB_STEP_SUMMARY
