name: Frontend Testing Pipeline

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '1-Presentation/admin-dashboard/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - '1-Presentation/admin-dashboard/**'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: 1-Presentation/admin-dashboard
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: 1-Presentation/admin-dashboard
        run: npm run test:unit:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./1-Presentation/admin-dashboard/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: 1-Presentation/admin-dashboard/coverage/
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = '1-Presentation/admin-dashboard/coverage/coverage-summary.json';

            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;

              const comment = `## 📊 Frontend Test Coverage Report

              | Metric | Coverage | Status |
              |--------|----------|--------|
              | **Lines** | ${total.lines.pct}% | ${total.lines.pct >= 60 ? '✅' : '⚠️'} |
              | **Statements** | ${total.statements.pct}% | ${total.statements.pct >= 60 ? '✅' : '⚠️'} |
              | **Functions** | ${total.functions.pct}% | ${total.functions.pct >= 60 ? '✅' : '⚠️'} |
              | **Branches** | ${total.branches.pct}% | ${total.branches.pct >= 60 ? '✅' : '⚠️'} |

              **Coverage Thresholds:** 60% (lines, functions, branches, statements)
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: 1-Presentation/admin-dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: 1-Presentation/admin-dashboard
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: 1-Presentation/admin-dashboard
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: 1-Presentation/admin-dashboard/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: 1-Presentation/admin-dashboard/test-results/
          retention-days: 7

  lint:
    name: Lint Frontend Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: 1-Presentation/admin-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: 1-Presentation/admin-dashboard
        run: npm run lint

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: 1-Presentation/admin-dashboard
        run: npm ci

      - name: Build Next.js app
        working-directory: 1-Presentation/admin-dashboard
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            1-Presentation/admin-dashboard/.next/
            1-Presentation/admin-dashboard/out/
          retention-days: 3

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint, build]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Frontend Testing Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Component Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Playwright) | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
