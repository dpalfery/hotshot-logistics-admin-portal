name: Azure Infrastructure Deployment

on:
  workflow_call:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: string
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: string
      region:
        description: 'Azure region to deploy to'
        required: true
        default: 'eastus2'
        type: string
      use_placeholder_image:
        description: 'Use placeholder image for initial deployment'
        required: false
        default: true
        type: boolean
      deploy:
        description: 'Deploy infrastructure (pulumi up)'
        required: false
        default: true
        type: boolean
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true
      AZURE_AD_B2C_INSTANCE:
        required: true
      AZURE_AD_B2C_CLIENT_ID:
        required: true
      AZURE_AD_B2C_DOMAIN:
        required: true
      AZURE_AD_B2C_TENANT_ID:
        required: true
      AZURE_AD_B2C_AUDIENCE:
        required: true
    outputs:
      acr_name:
        description: "Name of the Azure Container Registry"
        value: ${{ jobs.deploy.outputs.acr_name }}
      resource_group:
        description: "Name of the Azure Resource Group"
        value: ${{ jobs.deploy.outputs.resource_group }}
      container_app_name:
        description: "Name of the Container App (API)"
        value: ${{ jobs.deploy.outputs.container_app_name }}
      migration_job_name:
        description: "Name of the Migration Container App Job"
        value: ${{ jobs.deploy.outputs.migration_job_name }}
  workflow_dispatch:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      region:
        description: 'Azure region to deploy to'
        required: true
        default: 'eastus2'
        type: choice
        options:
          - eastus
          - eastus2
          - centralus
          - northcentralus
          - southcentralus
          - westcentralus
          - westus
          - westus2
          - westus3
      use_placeholder_image:
        description: 'Use placeholder image for initial deployment'
        required: false
        default: true
        type: boolean
      deploy:
        description: 'Deploy infrastructure (pulumi up)'
        required: false
        default: true
        type: boolean
      destroy:
        description: '⚠️ DESTROY infrastructure (pulumi destroy) - USE WITH CAUTION'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with Azure

jobs:
  preview:
    name: Preview Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Preview
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_AD_B2C_INSTANCE: ${{ secrets.AZURE_AD_B2C_INSTANCE }}
          AZURE_AD_B2C_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          AZURE_AD_B2C_DOMAIN: ${{ secrets.AZURE_AD_B2C_DOMAIN }}
          AZURE_AD_B2C_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
          AZURE_AD_B2C_AUDIENCE: ${{ secrets.AZURE_AD_B2C_AUDIENCE }}
        run: |
          pulumi stack select ${{ inputs.stack }} --create
          pulumi config set location ${{ inputs.region }}
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
          pulumi config rm azure-native:subscriptionId --path || true
          pulumi config rm azure-native:clientId --path || true
          pulumi config rm azure-native:tenantId --path || true
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi config set usePlaceholderImage ${{ inputs.use_placeholder_image }}
          pulumi preview --diff

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: preview
    if: ${{ inputs.deploy == true && inputs.destroy != true }}
    environment: ${{ inputs.github-environment }}
    outputs:
      acr_name: ${{ steps.outputs.outputs.acr_name }}
      resource_group: ${{ steps.outputs.outputs.resource_group }}
      container_app_name: ${{ steps.outputs.outputs.container_app_name }}
      migration_job_name: ${{ steps.outputs.outputs.migration_job_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Up
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_AD_B2C_INSTANCE: ${{ secrets.AZURE_AD_B2C_INSTANCE }}
          AZURE_AD_B2C_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          AZURE_AD_B2C_DOMAIN: ${{ secrets.AZURE_AD_B2C_DOMAIN }}
          AZURE_AD_B2C_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
          AZURE_AD_B2C_AUDIENCE: ${{ secrets.AZURE_AD_B2C_AUDIENCE }}
        run: |
          pulumi stack select ${{ inputs.stack }}
          pulumi config set location ${{ inputs.region }}
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
          pulumi config rm azure-native:subscriptionId --path || true
          pulumi config rm azure-native:clientId --path || true
          pulumi config rm azure-native:tenantId --path || true
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi config set usePlaceholderImage ${{ inputs.use_placeholder_image }}
          pulumi up --yes --skip-preview

      - name: Export Stack Outputs
        id: outputs
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          # Export full JSON for artifact (exclude secrets)
          pulumi stack output --json --show-secrets=false > stack-outputs.json
          
          # Extract key outputs for job outputs (used by subsequent jobs)
          ACR_NAME=$(pulumi stack output containerRegistryName 2>/dev/null || echo "")
          RESOURCE_GROUP=$(pulumi stack output resourceGroupName 2>/dev/null || echo "")
          CONTAINER_APP_NAME=$(pulumi stack output containerAppName 2>/dev/null || echo "")
          CONTAINER_APP_URL=$(pulumi stack output containerAppFullUrl 2>/dev/null || echo "")
          STATIC_WEB_APP_URL=$(pulumi stack output staticWebAppFullUrl 2>/dev/null || echo "")
          STATIC_WEB_APP_NAME=$(pulumi stack output staticWebAppName 2>/dev/null || echo "")
          MIGRATION_JOB_NAME=$(pulumi stack output migrationJobName 2>/dev/null || echo "")
          
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "container_app_name=$CONTAINER_APP_NAME" >> $GITHUB_OUTPUT
          echo "container_app_url=$CONTAINER_APP_URL" >> $GITHUB_OUTPUT
          echo "static_web_app_url=$STATIC_WEB_APP_URL" >> $GITHUB_OUTPUT
          echo "static_web_app_name=$STATIC_WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "migration_job_name=$MIGRATION_JOB_NAME" >> $GITHUB_OUTPUT
          
          echo "### Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ACR Name | $ACR_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | $RESOURCE_GROUP |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | $CONTAINER_APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | $CONTAINER_APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Web App | $STATIC_WEB_APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Job | $MIGRATION_JOB_NAME |" >> $GITHUB_STEP_SUMMARY

      - name: Update GitHub Environment Variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the container app URL from Pulumi outputs
          API_URL="${{ steps.outputs.outputs.container_app_url }}"
          ENVIRONMENT="${{ inputs.github-environment }}"
          
          if [ -n "$API_URL" ]; then
            echo "Updating NEXT_PUBLIC_API_URL in $ENVIRONMENT environment..."
            
            # Update environment variable using GitHub CLI
            gh variable set NEXT_PUBLIC_API_URL \
              --env "$ENVIRONMENT" \
              --body "$API_URL" \
              --repo ${{ github.repository }} 2>/dev/null || {
                echo "⚠️ Could not auto-update NEXT_PUBLIC_API_URL variable"
                echo "Please manually set NEXT_PUBLIC_API_URL=$API_URL"
                echo "in GitHub Settings → Environments → $ENVIRONMENT → Variables"
              }
            
            echo "✅ API URL available: $API_URL"
          else
            echo "⚠️ Container App URL not available yet"
          fi

      - name: Configure Container App Environment Variables
        run: |
          # Get the actual Container App FQDN and Static Web App URL
          CONTAINER_APP_NAME="${{ steps.outputs.outputs.container_app_name }}"
          RESOURCE_GROUP="${{ steps.outputs.outputs.resource_group }}"
          CONTAINER_APP_URL="${{ steps.outputs.outputs.container_app_url }}"
          STATIC_WEB_APP_URL="${{ steps.outputs.outputs.static_web_app_url }}"
          
          # Extract just the hostname (remove https://)
          CONTAINER_APP_FQDN=$(echo "$CONTAINER_APP_URL" | sed 's|https://||')
          
          # Set ALLOWED_HOSTS and CORS_ALLOWED_ORIGINS
          echo "Configuring Container App environment variables..."
          echo "  ALLOWED_HOSTS: $CONTAINER_APP_FQDN"
          echo "  CORS_ALLOWED_ORIGINS: $STATIC_WEB_APP_URL,$CONTAINER_APP_URL,http://localhost:3000"
          
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "ALLOWED_HOSTS=$CONTAINER_APP_FQDN" \
              "CORS_ALLOWED_ORIGINS=$STATIC_WEB_APP_URL,$CONTAINER_APP_URL,http://localhost:3000"
          
          echo "✅ Container App environment variables configured (new revision created automatically)"
          
          echo "### ✅ Container App Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ALLOWED_HOSTS | \`$CONTAINER_APP_FQDN\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CORS_ALLOWED_ORIGINS | \`$STATIC_WEB_APP_URL,$CONTAINER_APP_URL,http://localhost:3000\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Stack Outputs
        uses: actions/upload-artifact@v4
        with:
          name: pulumi-outputs
          path: 7-Deployment/Azure-deploy/stack-outputs.json

  destroy:
    name: ⚠️ Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: preview
    if: ${{ inputs.destroy == true }}
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Destroy
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          pulumi stack select ${{ inputs.stack }}
          pulumi config set location ${{ inputs.region }}
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }}  
          pulumi config rm azure-native:subscriptionId --path || true
          pulumi config rm azure-native:clientId --path || true
          pulumi config rm azure-native:tenantId --path || true
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi destroy --yes
