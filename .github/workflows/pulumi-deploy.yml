name: Pulumi Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - '7-Deployment/Azure-deploy/**'
  workflow_dispatch:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deploy:
        description: 'Deploy infrastructure (pulumi up)'
        required: false
        default: true
        type: boolean
      destroy:
        description: '⚠️ DESTROY infrastructure (pulumi destroy) - USE WITH CAUTION'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with Azure

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.github-environment || 'development' }}-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Preview
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          pulumi stack select ${{ github.event.inputs.stack || 'dev' }} --create
          pulumi config set location eastus2
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi preview --diff

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: preview
    if: |
      (github.event_name == 'push') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.destroy != 'true')
    environment: ${{ github.event.inputs.github-environment || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Up
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          pulumi stack select ${{ github.event.inputs.stack || 'dev' }}
          pulumi config set location eastus2
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi up --yes --skip-preview

      - name: Export Stack Outputs
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi stack output --json > stack-outputs.json

      - name: Upload Stack Outputs
        uses: actions/upload-artifact@v4
        with:
          name: pulumi-outputs
          path: 7-Deployment/Azure-deploy/stack-outputs.json

  destroy:
    name: ⚠️ Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: preview
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    environment: ${{ github.event.inputs.github-environment || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/Azure-deploy
        run: dotnet restore

      - name: Pulumi Destroy
        working-directory: 7-Deployment/Azure-deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          pulumi stack select ${{ github.event.inputs.stack || 'dev' }}
          pulumi config set location eastus2
          pulumi config set azureTenantId ${{ secrets.AZURE_TENANT_ID }}
          pulumi config set subscriptionId ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi destroy --yes
