name: Pulumi Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - '7-Deployment/pulumi/**'
  workflow_dispatch:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with Azure

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          auth-type: identity
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/pulumi
        run: dotnet restore

      - name: Pulumi Preview
        working-directory: 7-Deployment/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack select ${{ github.event.inputs.stack || 'dev' }} --create
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi preview --diff

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: preview
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'dev')
    environment:
      name: ${{ github.event.inputs.stack || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: ^3.0.0

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          auth-type: identity
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        working-directory: 7-Deployment/pulumi
        run: dotnet restore

      - name: Pulumi Up
        working-directory: 7-Deployment/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack select ${{ github.event.inputs.stack || 'dev' }}
          pulumi config set sqlAdminPassword --secret ${{ secrets.SQL_ADMIN_PASSWORD }}
          pulumi up --yes --skip-preview

      - name: Export Stack Outputs
        working-directory: 7-Deployment/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi stack output --json > stack-outputs.json

      - name: Upload Stack Outputs
        uses: actions/upload-artifact@v4
        with:
          name: pulumi-outputs
          path: 7-Deployment/pulumi/stack-outputs.json
