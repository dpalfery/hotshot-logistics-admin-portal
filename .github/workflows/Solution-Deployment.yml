name: Solution Deployment (Mono)

on:
  push:
    branches:
      - main
    paths:
      - '7-Deployment/Azure-deploy/**'
  workflow_dispatch:
    inputs:
      github-environment:
        description: 'GitHub Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      stack:
        description: 'Pulumi stack to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      region:
        description: 'Azure region to deploy to'
        required: true
        default: 'eastus2'
        type: choice
        options:
          - eastus
          - eastus2
          - centralus
          - northcentralus
          - southcentralus
          - westcentralus
          - westus
          - westus2
          - westus3
      use_placeholder_image:
        description: 'Use placeholder image for initial deployment (before pushing your own image)'
        required: false
        default: true
        type: boolean
      deploy:
        description: 'Deploy infrastructure (pulumi up)'
        required: false
        default: true
        type: boolean
      build_and_push:
        description: 'Build and push container image after infrastructure deployment'
        required: false
        default: false
        type: boolean
      deploy_static_web_app:
        description: 'Deploy static web app (Next.js admin dashboard)'
        required: false
        default: true
        type: boolean
      destroy:
        description: '⚠️ DESTROY infrastructure (pulumi destroy) - USE WITH CAUTION'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with Azure

env:
  # GitHub CLI is used to update environment variables after deployment
  GH_TOKEN: ${{ github.token }}

jobs:
  infrastructure:
    name: Azure Infrastructure
    uses: ./.github/workflows/Azure-deploy.yml
    with:
      github-environment: ${{ github.event.inputs.github-environment || 'development' }}
      stack: ${{ github.event.inputs.stack || 'dev' }}
      region: ${{ github.event.inputs.region || 'eastus2' }}
      use_placeholder_image: ${{ github.event_name == 'push' || github.event.inputs.use_placeholder_image == 'true' }}
      deploy: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
      destroy: ${{ github.event.inputs.destroy == 'true' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      AZURE_AD_B2C_INSTANCE: ${{ secrets.AZURE_AD_B2C_INSTANCE }}
      AZURE_AD_B2C_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
      AZURE_AD_B2C_DOMAIN: ${{ secrets.AZURE_AD_B2C_DOMAIN }}
      AZURE_AD_B2C_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
      AZURE_AD_B2C_AUDIENCE: ${{ secrets.AZURE_AD_B2C_AUDIENCE }}

  # Build and push container image after infrastructure is ready
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: infrastructure
    if: |
      (github.event_name == 'push') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_and_push == 'true' && github.event.inputs.destroy != 'true')
    environment: ${{ github.event.inputs.github-environment || 'development' }}
    env:
      IMAGE_NAME: hotshot-api
      MIGRATION_JOB_IMAGE_NAME: hotshot-db-migration-job
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure Azure credentials (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (OIDC)
        run: |
          az acr login --name ${{ needs.infrastructure.outputs.acr_name }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract metadata (tags, labels) for Migration Job
        id: meta-job
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.infrastructure.outputs.acr_name }}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Migration Job Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./7-Deployment/HotshotLogistics.DbMigrationJob/Dockerfile
          push: true
          tags: ${{ steps.meta-job.outputs.tags }}
          labels: ${{ steps.meta-job.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update Container Apps with new images
        run: |
          RESOURCE_GROUP="${{ needs.infrastructure.outputs.resource_group }}"
          ACR_NAME="${{ needs.infrastructure.outputs.acr_name }}"
          
          # Update API Container App
          CONTAINER_APP_NAME="${{ needs.infrastructure.outputs.container_app_name }}"
          API_IMAGE="${ACR_NAME}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          
          if [ -n "$CONTAINER_APP_NAME" ]; then
            echo "Updating Container App: $CONTAINER_APP_NAME"
            echo "Image: $API_IMAGE"
            
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$API_IMAGE"
            
            echo "✅ Container App updated successfully"
          fi

          # Update Migration Job
          MIGRATION_JOB_NAME="${{ needs.infrastructure.outputs.migration_job_name }}"
          JOB_IMAGE="${ACR_NAME}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}:latest"

          if [ -n "$MIGRATION_JOB_NAME" ]; then
            echo "Updating Migration Job: $MIGRATION_JOB_NAME"
            echo "Image: $JOB_IMAGE"
            
            az containerapp job update \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$JOB_IMAGE"
            
            echo "✅ Migration Job updated successfully"
          fi

      - name: Summary
        run: |
          echo "### 🚀 Container Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Container Registry | ${{ needs.infrastructure.outputs.acr_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | ${{ needs.infrastructure.outputs.container_app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Job | ${{ needs.infrastructure.outputs.migration_job_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Image | ${{ needs.infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Job Image | ${{ needs.infrastructure.outputs.acr_name }}.azurecr.io/${{ env.MIGRATION_JOB_IMAGE_NAME }}:latest |" >> $GITHUB_STEP_SUMMARY

  # Deploy Static Web App (Next.js Admin Dashboard)
  deploy-static-web-app:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: infrastructure
    if: |
      (github.event_name == 'push') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_static_web_app == 'true' && github.event.inputs.destroy != 'true')
    environment: ${{ github.event.inputs.github-environment || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: 1-Presentation/admin-dashboard
        run: npm ci

      - name: Get API URL from infrastructure outputs
        id: get-api-url
        env:
          CONFIGURED_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          # Prefer configured API URL from GitHub secrets/vars
          if [ -n "$CONFIGURED_API_URL" ]; then
            echo "Using configured API URL: $CONFIGURED_API_URL"
            echo "api_url=$CONFIGURED_API_URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Try to get it from Pulumi stack outputs
          if [ -n "$PULUMI_ACCESS_TOKEN" ]; then
            echo "Fetching API URL from Pulumi stack..."
            
            # Install Pulumi CLI
            curl -fsSL https://get.pulumi.com | sh
            export PATH=$PATH:$HOME/.pulumi/bin
            
            cd 7-Deployment/Azure-deploy
            
            # Use the stack from workflow inputs
            STACK="${{ github.event.inputs.stack || 'dev' }}"
            pulumi stack select $STACK --non-interactive 2>/dev/null || true
            API_URL=$(pulumi stack output containerAppFullUrl 2>/dev/null || echo "")
            
            if [ -n "$API_URL" ]; then
              echo "✅ Got API URL from Pulumi: $API_URL"
              echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Could not get API URL from Pulumi"
              echo "api_url=" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ PULUMI_ACCESS_TOKEN not set, cannot fetch API URL"
            echo "api_url=" >> $GITHUB_OUTPUT
          fi

      - name: Validate Azure AD Configuration
        env:
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
        run: |
          echo "Validating Azure AD / Entra External ID configuration..."
          
          if [ -z "$NEXT_PUBLIC_AZURE_CLIENT_ID" ]; then
            echo "⚠️ Warning: AZURE_AD_B2C_CLIENT_ID secret is not set"
          else
            echo "✅ Azure Client ID is configured"
          fi
          
          if [ -z "$NEXT_PUBLIC_AZURE_TENANT_ID" ]; then
            echo "⚠️ Warning: AZURE_AD_B2C_TENANT_ID secret is not set"
          else
            echo "✅ Azure Tenant ID is configured"
          fi

      - name: Build Next.js app
        working-directory: 1-Presentation/admin-dashboard
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ steps.get-api-url.outputs.api_url }}
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
        run: |
          echo "Building Next.js app with:"
          echo "  - API URL: ${NEXT_PUBLIC_API_URL:-'not set'}"
          echo "  - Azure Client ID: ${NEXT_PUBLIC_AZURE_CLIENT_ID:0:8}... (masked)"
          echo "  - Azure Tenant ID: ${NEXT_PUBLIC_AZURE_TENANT_ID:0:8}... (masked)"
          npm run build

      - name: Configure Azure credentials (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Static Web App Name from Pulumi
        id: get-swa-name
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          # Install Pulumi CLI
          curl -fsSL https://get.pulumi.com | sh
          export PATH=$PATH:$HOME/.pulumi/bin
          
          cd 7-Deployment/Azure-deploy
          
          STACK="${{ github.event.inputs.stack || 'dev' }}"
          pulumi stack select $STACK --non-interactive 2>/dev/null || true
          
          SWA_NAME=$(pulumi stack output staticWebAppName 2>/dev/null || echo "")
          RESOURCE_GROUP=$(pulumi stack output resourceGroupName 2>/dev/null || echo "")
          
          if [ -n "$SWA_NAME" ]; then
            echo "✅ Found Static Web App: $SWA_NAME in $RESOURCE_GROUP"
            echo "swa_name=$SWA_NAME" >> $GITHUB_OUTPUT
            echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          else
            echo "❌ Could not find Static Web App name from Pulumi"
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        id: deploy
        run: |
          SWA_NAME="${{ steps.get-swa-name.outputs.swa_name }}"
          RESOURCE_GROUP="${{ steps.get-swa-name.outputs.resource_group }}"
          
          echo "Deploying to Static Web App: $SWA_NAME"
          
          # Install SWA CLI
          npm install -g @azure/static-web-apps-cli
          
          # Get deployment token using Azure CLI (we're already logged in via OIDC)
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          
          # Deploy using SWA CLI with the token
          swa deploy "1-Presentation/admin-dashboard/out" \
            --deployment-token "$DEPLOYMENT_TOKEN" \
            --env production
          
          echo "✅ Deployment completed successfully"

      - name: Deployment Summary
        env:
          API_URL: ${{ steps.get-api-url.outputs.api_url }}
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ secrets.AZURE_AD_B2C_TENANT_ID }}
        run: |
          echo "### 🚀 Static Web App Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -n "$NEXT_PUBLIC_AZURE_CLIENT_ID" ]; then
            echo "| Azure AD Client ID | ✅ Configured |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Azure AD Client ID | ⚠️ Not Set |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$NEXT_PUBLIC_AZURE_TENANT_ID" ]; then
            echo "| Azure AD Tenant ID | ✅ Configured |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Azure AD Tenant ID | ⚠️ Not Set |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$API_URL" ]; then
            echo "| API URL | ✅ $API_URL |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| API URL | ⚠️ Not Set |" >> $GITHUB_STEP_SUMMARY
          fi
